name: silent_alpha
description: "Anonymous Social — a campus-first pseudonymous social platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1

  # State management
  provider: ^6.1.5

  # UI / UX
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  animate_do: ^3.3.4
  lottie: ^3.3.1

  # Utilities
  timeago: ^3.7.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.16
  flutter_image_compress: ^2.3.0

  # Forms & Validation
  form_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
